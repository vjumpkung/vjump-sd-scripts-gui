<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/logo.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#e0e5ec" />
        <title>SD-Scripts GUI</title>
        <script>
            // Apply the saved theme before first paint so there is no flash of the wrong theme.
            ;(function () {
                try {
                    var raw = window.localStorage.getItem('sdgui:theme')
                    var mode = raw ? JSON.parse(raw).state.mode : 'system'
                    var dark =
                        mode === 'dark' ||
                        (mode !== 'light' &&
                            window.matchMedia('(prefers-color-scheme: dark)').matches)
                    document.documentElement.classList.toggle('dark', dark)
                    var rawLocale = window.localStorage.getItem('sdgui:locale')
                    var locale = rawLocale
                        ? JSON.parse(rawLocale).state.locale
                        : (navigator.language || '').toLowerCase().indexOf('th') === 0
                          ? 'th'
                          : 'en'
                    document.documentElement.lang = locale === 'th' ? 'th' : 'en'
                } catch (e) {}
            })()
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
